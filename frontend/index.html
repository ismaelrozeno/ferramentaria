<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica a aparência salva neste navegador antes de a página aparecer (evita piscar o tema errado).
      try {
        var p = JSON.parse(localStorage.getItem("ferrum.aparencia")) || {};
        var tema = p.tema || "escuro";
        if (tema === "sistema") tema = matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
        var h = document.documentElement;
        h.dataset.tema = tema;
        h.dataset.acento = p.acento || "verde";
        h.dataset.fundo = p.fundo || "padrao";
        h.dataset.icones = p.icones || "acento";
        h.dataset.menu = p.menu || "esquerda";
      } catch (e) {}
    </script>
    <title>Ferrum</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
